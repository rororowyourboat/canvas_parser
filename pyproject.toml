[project]
name = "canvas-parser"
version = "0.1.0"
description = "Lightweight bridge between Obsidian JSON Canvas and declarative diagram languages (Mermaid, D2) with local rendering."
readme = "README.md"
license = "MIT"
authors = [
    { name = "rohan", email = "e4rohan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
local = ["d2-python-wrapper"]

[project.urls]
Homepage = "https://github.com/rororowyourboat/canvas_parser"
Repository = "https://github.com/rororowyourboat/canvas_parser"
Issues = "https://github.com/rororowyourboat/canvas_parser/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
